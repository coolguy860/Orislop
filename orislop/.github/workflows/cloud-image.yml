name: Publish Orislop Cloud image

on:
  push:
    branches: [main]
    paths:
      - "apps/detector-bridge/**"
      - "core/**"
      - "configs/**"
      - "docker-compose.cloud.yml"
      - ".dockerignore"
      - ".github/workflows/cloud-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/orislop-cloud

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify cloud release contracts
        run: |
          node scripts/checkCloudDeployment.mjs
          python3 apps/detector-bridge/tests/test_cloud_beta.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-

      - name: Build and publish the GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/detector-bridge/Dockerfile.cloud
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
