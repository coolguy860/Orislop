<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Instagram adapter fixture</title></head>
  <body>
    <article id="candidate">
      <header><a role="link" href="https://www.instagram.com/climate.lab/">climate.lab</a></header>
      <a href="https://www.instagram.com/reel/C123abc/?utm_source=test">Open reel</a>
      <div id="media"><video aria-label="Climate explainer" poster="https://scontent.cdninstagram.com/preview.jpg" preload="none"><source src="https://scontent.cdninstagram.com/video.mp4" type="video/mp4"></video></div>
      <span dir="auto">Like</span><span dir="auto">12.4K</span>
      <span dir="auto">A new climate study shows ocean temperatures increased during the measured period.</span>
    </article>
    <script>globalThis.__ORISLOP_TEST__ = true;</script>
    <script src="../../src/aiClassifierModel.generated.js"></script>
    <script src="../../src/classifier.js"></script>
    <script src="../../src/platformAdapters.js"></script>
    <script src="../../src/controlCore.js"></script>
    <script src="../../src/contentScript.js"></script>
    <script>
      const api = globalThis.__ORISLOP_EXTENSION_TEST_API__;
      const element = document.getElementById("candidate");
      const candidate = api.extractCandidate(element, "instagram");
      const decision = globalThis.OrislopClassifier.scoreCandidate(candidate);
      document.body.dataset.result = encodeURIComponent(JSON.stringify({
        platform: candidate.platform,
        itemId: candidate.itemId,
        itemKind: candidate.itemKind,
        title: candidate.title,
        creator: candidate.channelName,
        visibleText: candidate.visibleText,
        mediaUrl: candidate.mediaUrl,
        previewUrl: candidate.previewUrl,
        mediaHost: api.findMediaHost(element, candidate)?.id || "",
        factCheckEligible: decision.factCheckEligible
      }));
    </script>
  </body>
</html>
