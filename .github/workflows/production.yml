name: Production readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orislop
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orislop/pnpm-lock.yaml

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: orislop/apps/detector-bridge/requirements.txt

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned detector dependencies
        run: python -m pip install -r apps/detector-bridge/requirements.txt

      - name: Run production gate
        run: pnpm run production:check

      - name: Publish verified release candidates
        if: success() && hashFiles('orislop/dist/release-manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: orislop-production-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            orislop/dist/orislop-browser-extension.zip
            orislop/dist/orislop-namecheap-static.zip
            orislop/dist/release-manifest.json
